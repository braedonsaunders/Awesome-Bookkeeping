<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dash {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes barRise {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.25); }
    }

    .animated-line {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: dash 5s ease-in-out infinite alternate;
    }
    .floating-element-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-element-2 { animation: floatSlow 8s ease-in-out infinite 1s; transform-origin: center; }
    .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .bar-1 { animation: barRise 3s ease-in-out infinite 0.2s; transform-origin: bottom; }
    .bar-2 { animation: barRise 3.5s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .bar-3 { animation: barRise 2.8s ease-in-out infinite 0.8s; transform-origin: bottom; }
    .bar-4 { animation: barRise 4s ease-in-out infinite 0.1s; transform-origin: bottom; }
  </style>

  <!-- Background Grid -->
  <rect width="1200" height="320" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.12" class="glowing-orb" />
  <circle cx="1050" cy="240" r="140" fill="#c084fc" opacity="0.1" class="glowing-orb" />

  <!-- Background Dynamic Graph / Wave (Non-obscuring, bottom aligned) -->
  <path d="M 0 240 Q 250 180, 500 230 T 1000 170 T 1200 210 L 1200 320 L 0 320 Z" fill="url(#areaGradient)" />
  <path d="M 0 240 Q 250 180, 500 230 T 1000 170 T 1200 210" fill="none" stroke="url(#lineGradient)" stroke-width="4" class="animated-line" filter="url(#glow)" />

  <!-- Background Decorative Animated Financial Bars (Right Side) -->
  <g opacity="0.3" transform="translate(920, 110)">
    <rect x="0" y="40" width="18" height="70" rx="4" fill="#38bdf8" class="bar-1" />
    <rect x="28" y="20" width="18" height="90" rx="4" fill="#818cf8" class="bar-2" />
    <rect x="56" y="55" width="18" height="55" rx="4" fill="#c084fc" class="bar-3" />
    <rect x="84" y="10" width="18" height="100" rx="4" fill="#34d399" class="bar-4" />
  </g>

  <!-- Decorative Floating Financial Symbols (Background/Sides) -->
  <g class="floating-element-1" transform="translate(100, 190)" opacity="0.25">
    <circle cx="20" cy="20" r="24" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="27" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">$</text>
  </g>
  <g class="floating-element-2" transform="translate(1060, 70)" opacity="0.25">
    <circle cx="20" cy="20" r="22" fill="none" stroke="#c084fc" stroke-width="2" />
    <text x="20" y="27" text-anchor="middle" fill="#c084fc" font-size="20" font-weight="bold">€</text>
  </g>

  <!-- Main Foreground Content (Title & Subtitle) -->
  <g transform="translate(80, 0)">
    <!-- Header Tag / Pill -->
    <g transform="translate(0, 50)">
      <rect width="250" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#34d399" />
      <text x="30" y="21" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1">CURATED DIRECTORY 2026</text>
    </g>

    <!-- Title -->
    <text x="0" y="138" font-size="44" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5">
      Awesome Bookkeeping Software
    </text>

    <!-- Subtitle -->
    <text x="0" y="178" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Top SaaS Accounting Platforms &amp; Self-Hosted Open-Source Ledgers
    </text>

    <!-- Feature Highlights Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-size="13" font-weight="500">📊 Double-Entry</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(177, 0)">
        <rect width="175" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-size="13" font-weight="500">⚡ SaaS Pricing &amp; Scale</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(364, 0)">
        <rect width="185" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-size="13" font-weight="500">⭐ Open-Source Stars</text>
      </g>
    </g>
  </g>
</svg>
